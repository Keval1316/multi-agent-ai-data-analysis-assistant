<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Brand Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AD8B73" />
      <stop offset="100%" stop-color="#3E2723" />
    </linearGradient>

    <!-- Accent Data Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E3CAA5" />
      <stop offset="100%" stop-color="#FFFBE9" />
    </linearGradient>

    <!-- Subtle Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Warm Theme Stroke -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#CEAB93" stroke-width="1.5" />

  <!-- Multi-Agent Network Polyline -->
  <path d="M18 42 L28 26 L38 34 L48 18" stroke="#E3CAA5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

  <!-- Analytical Chart Bars -->
  <rect x="15" y="38" width="6" height="12" rx="2" fill="url(#barGrad)" opacity="0.85" />
  <rect x="25" y="28" width="6" height="22" rx="2" fill="url(#barGrad)" opacity="0.95" />
  <rect x="35" y="32" width="6" height="18" rx="2" fill="url(#barGrad)" opacity="0.9" />
  <rect x="45" y="20" width="6" height="30" rx="2" fill="#FFFFFF" />

  <!-- Agent Interconnect Nodes -->
  <circle cx="18" cy="42" r="2.5" fill="#FFFBE9" />
  <circle cx="28" cy="26" r="2.5" fill="#FFFBE9" />
  <circle cx="38" cy="34" r="2.5" fill="#FFFBE9" />
  <circle cx="48" cy="18" r="3.5" fill="#FFFFFF" filter="url(#glow)" />

  <!-- AI Intelligence Sparkle -->
  <path d="M48 10 Q48 16 54 16 Q48 16 48 22 Q48 16 42 16 Q48 16 48 10 Z" fill="#FFFBE9" />
</svg>
